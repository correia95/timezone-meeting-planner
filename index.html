      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Time Zone Meeting Planner",
        "url": "https://timezone-meeting-planner.correia95.workers.dev/",

        "description": "Compare working hours across time zones and find a meeting time that suits everyone, with daylight-saving handled automatically."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I find a meeting time that works across time zones?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Add each person's city, then slide through the day. The grid shows the local time in every city for each hour and colours it green when it falls in normal working hours, so you can pick a column that is green or amber everywhere."
            }
          },
          {
            "@type": "Question",
            "name": "Does this handle daylight saving time?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Offsets are calculated for the exact date you choose using your browser's time zone database, so a meeting planned for a future month uses that month's rules, including weeks when countries have switched on different weekends."
            }
          },
          {
            "@type": "Question",
            "name": "Can I share the plan with my team?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The city list, date and proposed time are stored in the page link. Copy it and send it, and everyone opening the link sees exactly the same grid."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data sent anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The planner runs entirely in your browser and stores nothing on a server. The only place your selections are kept is the shareable link."
            }
          }
        ]
      }
    </script>
